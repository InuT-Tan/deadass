# Support haptic profile for the Lovelock addon (lovelock/dist/pak01_dir.vpk).
# Apply with:  python3 lovelock/support_profile.py
# The script merges these tables into your deadass config.toml; your connection
# settings, per-trigger toy selection and shock settings are kept.
#
# One effect plays at a time, and a new one interrupts only if it is at least as
# strong. Strength is therefore also priority, and the order below is deliberate.
#
# Patterns: vibrate holds; pulse is three on/off beats; ramp climbs 40% -> 70% ->
# 100% of strength in thirds. Ability slots are tuned for Rem (1 Pillow Toss,
# 2 Tag Along, 3 Lil Helpers, 4 Naptime) but each slot keeps its own feel on any hero.
# One cast often reports twice (up to ~2 s apart on ultimates), hence the 1 s
# ability and 4 s ultimate cooldowns.

# --- top of the ladder: rare, game-shaping ---

[triggers.match_won]
enabled = true
strength = 1.0
duration_ms = 5000
retrigger_cooldown_ms = 500
pattern = "ramp"

[triggers.patron_weakened]
enabled = true
strength = 0.95
duration_ms = 3500
retrigger_cooldown_ms = 500
pattern = "ramp"

# Rarer for a support: three heavy beats.
[triggers.kill]
enabled = true
strength = 0.9
